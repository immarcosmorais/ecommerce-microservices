name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build config-server
        run: mvn -f config-server/pom.xml package -DskipTests

      - name: Build discovery-server
        run: mvn -f discovery-server/pom.xml package -DskipTests

      - name: Build gateway
        run: mvn -f gateway/pom.xml package -DskipTests

      - name: Build product-service
        run: mvn -f product-service/pom.xml package -DskipTests

      - name: Build order-service
        run: mvn -f order-service/pom.xml package -DskipTests

      - name: Build payment-service
        run: mvn -f payment-service/pom.xml package -DskipTests

      - name: Build orchestrator-service
        run: mvn -f orchestrator-service/pom.xml package -DskipTests

      - name: Build notification-service
        run: mvn -f notification-service/pom.xml package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push config-server
        uses: docker/build-push-action@v5
        with:
          context: ./config-server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: immarcosmorais/config-server:latest

      - name: Build and push discovery-server
        uses: docker/build-push-action@v5
        with:
          context: ./discovery-server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: immarcosmorais/discovery-server:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: immarcosmorais/gateway:latest

      - name: Build and push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./product-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: immarcosmorais/product-service:latest

      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: immarcosmorais/order-service:latest

      - name: Build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: immarcosmorais/payment-service:latest

      - name: Build and push orchestrator-service
        uses: docker/build-push-action@v5
        with:
          context: ./orchestrator-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: immarcosmorais/orchestrator-service:latest

      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: immarcosmorais/notification-service:latest