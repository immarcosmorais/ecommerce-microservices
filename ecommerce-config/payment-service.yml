server:
  port: 8083

spring:
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info, circuitbreakers
  health:
    circuitbreakers:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: k8s
  kafka:
    bootstrap-servers: kafka:9092
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/