apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-product
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-product
  template:
    metadata:
      labels:
        app: postgres-product
    spec:
      containers:
        - name: postgres-product
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: product_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-product
  namespace: ecommerce
spec:
  selector:
    app: postgres-product
  ports:
    - port: 5432
      targetPort: 5432